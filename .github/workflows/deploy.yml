name: Despliegue en GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias web
        run: |
          cd app
          npm ci

      - name: Validar reglas médicas, proteína y lista de la compra
        run: python scripts/verificar_reglas.py

      - name: Empaquetar datos cifrados y compilar aplicación
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          cd app
          npm run build

      - name: Auditar que el JS publicado no filtra datos personales
        run: python scripts/audit_bundle.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/dist'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
