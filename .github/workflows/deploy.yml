name: Despliegue en GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  # La acción semanal (semana.yml) lo llama después de cambiar de semana, porque un push
  # hecho con GITHUB_TOKEN no dispara este workflow por sí solo
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          # Llamado desde semana.yml: publicar main con la semana recién activada
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias web
        run: |
          cd app
          npm ci

      # Por si la acción del sábado no llegó a ejecutarse: publica la semana que toca por fecha
      # si ya está guardada en data/semanas/ (solo en esta copia, no cambia el repositorio)
      - name: Activar la semana que corresponde a hoy
        run: python scripts/semanas.py activar

      - name: Validar reglas médicas, proteína, fechas y lista de la compra
        run: python scripts/verificar_reglas.py

      - name: Empaquetar datos cifrados y compilar aplicación
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          # Si falta el secreto, el build falla en vez de publicar el menú sin cifrar
          EXIGIR_CIFRADO: '1'
        run: |
          cd app
          npm run build

      - name: Auditar que el JS publicado no filtra datos personales
        run: python scripts/audit_bundle.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/dist'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
